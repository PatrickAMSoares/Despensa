<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Despensa</title>
  <meta name="theme-color" content="#F5F4EF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Despensa">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Navegação principal">
      <button class="tab" data-tab="despensa" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>
        <span>Despensa</span>
      </button>
      <button class="tab" data-tab="compras" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6.5"/></svg>
        <span>Compras</span><span class="badge" id="badge-compras" hidden></span>
      </button>
      <button class="tab-ler" data-act="ler" type="button" aria-label="Ler código de barras">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6v12M7.5 6v12M11 6v12M14 6v12M17.5 6v12M20 6v12"/></svg>
      </button>
      <button class="tab" data-tab="notas" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
        <span>Notas</span>
      </button>
      <button class="tab" data-tab="gastos" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M11 20V5M17 20v-7M3 20h18"/></svg>
        <span>Gastos</span>
      </button>
    </nav>
  </div>

  <!-- Leitor de código de barras -->
  <div id="scanner" class="scanner modo-entrada" hidden>
    <video id="video" playsinline muted autoplay></video>
    <div class="scan-top">
      <button class="round-btn" data-act="fechar-leitor" type="button" aria-label="Fechar leitor">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <span class="scan-title">Ler código de barras</span>
      <span class="round-spacer"></span>
    </div>
    <div class="modo" role="group" aria-label="Modo de leitura">
      <button type="button" data-mode="entrada">Comprei&nbsp;&nbsp;+1</button>
      <button type="button" data-mode="saida">Acabou&nbsp;&nbsp;−1</button>
    </div>
    <div class="frame" aria-hidden="true"><div class="laser"></div></div>
    <p class="scan-hint">Aponte para o código de barras.<br>Leitura contínua: vá passando os produtos.</p>
    <section class="scan-card" id="scan-card" aria-live="polite"></section>
  </div>

  <!-- Painel inferior (formulários) -->
  <div id="sheet-bd" class="sheet-bd" hidden>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="vendor/barcode-detector.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
